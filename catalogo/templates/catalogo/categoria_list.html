<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Categorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'produto_list' %}">📦 Gestão de Estoque</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'produto_list' %}">Produtos</a>
                <a class="nav-link active fw-bold text-white" href="{% url 'categoria_list' %}">Categorias</a>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 800px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-secondary h4">Categorias Cadastradas</h2>
            <a href="{% url 'categoria_create' %}" class="btn btn-success shadow-sm">+ Nova Categoria</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Nome da Categoria</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for categoria in categorias %}
                        <tr>
                            <td class="align-middle text-muted ps-4">#{{ categoria.id }}</td>
                            <td class="align-middle fw-bold">{{ categoria.nome }}</td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="2" class="text-center text-muted py-5">Nenhuma categoria cadastrada no momento.
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
